name: CI

on:
  push:
    branches: [main, "release/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Placeholders only for CI compile; env.ts allows defaults outside prod.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: placeholder-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build runs as production; must differ from schema defaults.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-real
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-real
          RESEND_API_KEY: re_ci_build_key
